name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest tests/ -v
      - name: Verify data generation
        run: |
          PYTHONPATH=src python3 -c "from src.generate_data import generate_all_data; data = generate_all_data(); print(f'Generated {len(data)} datasets')"
